name: Daily LeetCode Questions

on:
  schedule:
    # Runs at 08:00 IST (02:30 UTC) every day. Edit the cron to change the time.
    - cron: "17 7 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

permissions:
  contents: write   # needed so the workflow can commit the updated sent_questions.json

jobs:
  send-questions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python daily_leetcode.py

      - name: Commit updated sent log
        run: |
          git config user.name "leetcode-bot"
          git config user.email "actions@github.com"
          git add sent_questions.json
          git diff --staged --quiet || git commit -m "Update sent questions log"
          git push
